<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteMatch</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>

    <!-- Layar utama untuk pemilihan level -->
    <div id="level-select-screen" class="screen">
        <h1 class="game-title">ByteMatch</h1>
        <h2>PILIH LEVEL</h2>
        <div class="level-buttons">
            <button class="level-btn" data-level="1">Level 1: Aritmatika</button>
            <button class="level-btn" data-level="2">Level 2: Modulo & Div</button>
            <button class="level-btn" data-level="3">Level 3: Biner</button>
        </div>
    </div>

    <!-- area game -->
    <div id="game-screen">
        <div id="game-stats">
            <span id="score-display">Skor: 0</span>
            <div id="lives-display">
                <span>Nyawa: </span>
                <span class="life-icon"></span>
                <span class="life-icon"></span>
                <span class="life-icon"></span>
            </div>
        </div>

        <main id="game-board">
            <!-- Area Soal -->
            <div id="level">
                <h2 id="level-title">Level 1: Aritmatika</h2>
                <section id="questions-section">
                    <!-- Kosong: Akan diisi soal secara dinamis oleh JavaScript -->
                </section>

                <!-- Area Pilihan Jawaban -->
                <section id="answers-section">
                    <!-- Kosong: Akan diisi blok angka secara dinamis oleh JavaScript -->
                </section>
            </div>
        </main>
    </div>
    
    <script src="js/ui.js"></script>
    <script src="js/dragDrop.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
